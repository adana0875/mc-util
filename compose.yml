services:
  minecraft:
    image: docker.io/itzg/minecraft-server:java21-graalvm
    container_name: <container_name>
    restart: unless-stopped

    ports:
      - "25565:25565"

    environment:
      EULA: "TRUE"

      # Server type + version
      TYPE: "NEOFORGE"
      VERSION: "1.21.1"

      # Memory settings
      MEMORY: "12G"
      USE_AIKAR_FLAGS: "TRUE"

      # Optional settings
      MOTD: "Minecraft Server 1.21.1"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "<insert_pass>"
      ONLINE_MODE: "true"

      STOP_SERVER_ANNOUNCE_DELAY: "60"

      ENABLE_WHITELIST: "true"
      WHITELIST: |
        <add_users>
      OPS: |
        <add_users>
      CUSTOM_SERVER_PROPERTIES: |
        sync-chunk-writes=false

    volumes:
      # Main server data
      - ./data:/data:Z

      # Link mods/config to folder
      - ./conf/mods:/data/mods:Z
      - ./conf/config:/data/config:Z

    stdin_open: true
    tty: true
